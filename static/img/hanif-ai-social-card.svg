<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hanif AI Freelancing Academy</title>
  <desc id="desc">Learn. Build. Freelance with AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="470" width="180" height="8" rx="4" fill="url(#accent)"/>

  <!-- Brand mark -->
  <circle cx="140" cy="120" r="46" fill="none" stroke="#10b981" stroke-width="6"/>
  <circle cx="140" cy="120" r="18" fill="#10b981"/>

  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#93c5fd" letter-spacing="6">HANIF AI FREELANCING ACADEMY</text>

  <text x="80" y="330" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Learn. Build.</text>
  <text x="80" y="420" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Freelance with AI.</text>

  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#dbeafe">RAG-powered Academy · AI Tutor · Spec-Driven Development</text>
</svg>
